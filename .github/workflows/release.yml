name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # keyless cosign signing
  packages: write   # GHCR image

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all targets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=${DATE}"
          build() { # goos goarch [goarm] [suffix]
            local ext=""; [ "$1" = windows ] && ext=".exe"
            GOOS=$1 GOARCH=$2 GOARM=${3:-} CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" \
              -o "dist/speedtest-$1-${4:-$2}${ext}" ./cmd/speedtest
          }
          build linux amd64
          build linux arm64
          build linux arm 7 armv7
          build darwin amd64
          build darwin arm64
          build windows amd64
          (cd dist && sha256sum speedtest-* > checksums.txt && cat checksums.txt)

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false

      - uses: sigstore/cosign-installer@v3
      - name: Sign checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/anixops/anixops-speedtest:${{ github.ref_name }}
            ghcr.io/anixops/anixops-speedtest:latest
